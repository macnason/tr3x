[package]
name = "t3rex"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rex as the interface to T3 Code: one Rex window per T3 thread."

[dependencies]
t3term = { path = "../t3term" }
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-std", "io-util", "fs"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.12"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
