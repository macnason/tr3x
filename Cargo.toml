[workspace]
resolver = "3"
members = ["t3client", "tr3x"]

[profile.release]
strip = true

# Pictures are decoded, scaled and encoded in Reply; unoptimized, a screenshot takes seconds.
[profile.dev.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
image-webp = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
