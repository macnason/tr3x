name: release

# A tag like v0.2.0 builds a universal macOS binary and Linux binaries and attaches them to
# that tag's release, where install.sh downloads the latest from.
# Run by hand, it only builds and keeps the files as a run artifact, so a release can be tried
# before it's tagged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      NAME: t3rex-macos-universal
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked -p t3rex --target aarch64-apple-darwin
      - run: cargo build --release --locked -p t3rex --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir -p "dist/$NAME"
          lipo -create -output "dist/$NAME/t3rex" \
            target/aarch64-apple-darwin/release/t3rex \
            target/x86_64-apple-darwin/release/t3rex
          codesign --force --sign - "dist/$NAME/t3rex"
          lipo -info "dist/$NAME/t3rex"
          # The updater refuses a binary that doesn't say its release's version.
          want=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || want=$(sed -n 's/^version = "\(.*\)"/\1/p' t3rex/Cargo.toml | head -1)
          test "$("dist/$NAME/t3rex" --version)" = "t3rex $want" \
            || { echo "t3rex/Cargo.toml's version doesn't match $GITHUB_REF_NAME"; exit 1; }
          cp README.md LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          cat "dist/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: ${{ env.NAME }}
          path: dist/*.tar.gz*
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null  # another job made it first
          gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" --clobber

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            name: t3rex-linux-x86_64
          - runner: ubuntu-24.04-arm
            name: t3rex-linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p t3rex
      - name: Package
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/t3rex "dist/$NAME/t3rex"
          # The updater refuses a binary that doesn't say its release's version.
          want=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || want=$(sed -n 's/^version = "\(.*\)"/\1/p' t3rex/Cargo.toml | head -1)
          test "$("dist/$NAME/t3rex" --version)" = "t3rex $want" \
            || { echo "t3rex/Cargo.toml's version doesn't match $GITHUB_REF_NAME"; exit 1; }
          cp README.md LICENSE "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          cat "dist/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: ${{ env.NAME }}
          path: dist/*.tar.gz*
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null  # another job made it first
          gh release upload "$GITHUB_REF_NAME" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" --clobber
