name: cut-release

# Once a week, if CHANGELOG.md has anything under "Unreleased" and master's CI passed, bump
# tr3x's version, move those notes under the new version, tag it and start release.yml.
# Run by hand to cut one now, or to pick a minor bump.
#
# A tag pushed with GITHUB_TOKEN doesn't trigger other workflows, so release.yml is started
# on the tag directly.
on:
  schedule:
    - cron: "0 22 * * 0" # Monday 09:00 in Melbourne (AEDT)
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor]
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Anything to release
        id: gate
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          notes=$(awk '/^## Unreleased/{f=1;next} /^## /{exit} f' CHANGELOG.md | grep -c '[^[:space:]]' || true)
          commits=$(git rev-list --count "$last..HEAD")
          echo "last $last, $commits commits, $notes changelog lines"
          if [ "$commits" -eq 0 ] || [ "$notes" -eq 0 ]; then
            echo "Nothing new since $last"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ci=$(gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "ci on master's head is '${ci:-missing}', not cutting"; exit 1; }
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - name: Bump, tag and push
        if: steps.gate.outputs.go == 'yes'
        id: cut
        run: |
          cur=$(sed -n 's/^version = "\(.*\)"/\1/p' tr3x/Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "$cur"
          case "$BUMP" in
            minor) next="$major.$((minor + 1)).0" ;;
            *) next="$major.$minor.$((patch + 1))" ;;
          esac
          git rev-parse -q --verify "refs/tags/v$next" >/dev/null && { echo "v$next exists"; exit 1; }
          echo "$cur -> $next"

          sed -i "0,/^version = \"$cur\"/s//version = \"$next\"/" tr3x/Cargo.toml
          awk -v cur="$cur" -v nv="$next" '
            prev == "name = \"tr3x\"" && $0 == "version = \"" cur "\"" { $0 = "version = \"" nv "\"" }
            { print; prev = $0 }' Cargo.lock > Cargo.lock.new && mv Cargo.lock.new Cargo.lock
          sed -i "s/^## Unreleased$/## Unreleased\n\n## $next/" CHANGELOG.md
          git diff --stat
          cargo metadata --locked --format-version 1 >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $next"
          git tag "v$next"
          git push --atomic origin HEAD:master "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Start the release
        if: steps.gate.outputs.go == 'yes'
        run: gh workflow run release.yml --ref "${{ steps.cut.outputs.tag }}"
