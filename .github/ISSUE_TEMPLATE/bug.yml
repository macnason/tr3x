name: Something's wrong
description: A tab that's missing or wrong, a key that does nothing, an install that fails.
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: tr3x doctor
      description: The output of `tr3x doctor`. Check it for machine names you'd rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: sync.log
      description: The last lines of `~/.local/state/tr3x/sync.log`, if a tab is missing or stale. They list your thread titles, so trim what's private.
      render: text
  - type: input
    attributes:
      label: Versions
      description: "`tr3x --version`, T3 Code's version, and Rex's (Rex → About Rex)."
